name: Build and Release OTA

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetch the full Git history to generate technical release notes

      - name: Setup Go 🐹
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: dash/wasm/go.sum

      - name: Fetch and Merge Latest Nezha, ServerStatus & FRP Binaries 📥
        run: |
          mkdir -p Resources
          TEMP_DIR="temp_binaries"
          mkdir -p "${TEMP_DIR}"
          
          echo "Determining latest Nezha Agent version..."
          NEZHA_VER=$(curl -sI https://github.com/nezhahq/agent/releases/latest | grep -i location | awk -F'/' '{print $NF}' | tr -d '\r\n')
          echo "Latest Nezha Version: ${NEZHA_VER}"
          
          curl -L -o "${TEMP_DIR}/nezha_amd64.zip" "https://github.com/nezhahq/agent/releases/download/${NEZHA_VER}/nezha-agent_darwin_amd64.zip"
          curl -L -o "${TEMP_DIR}/nezha_arm64.zip" "https://github.com/nezhahq/agent/releases/download/${NEZHA_VER}/nezha-agent_darwin_arm64.zip"
          
          unzip -o "${TEMP_DIR}/nezha_amd64.zip" -d "${TEMP_DIR}/nezha_amd64"
          unzip -o "${TEMP_DIR}/nezha_arm64.zip" -d "${TEMP_DIR}/nezha_arm64"
          
          lipo -create \
            "${TEMP_DIR}/nezha_amd64/nezha-agent" \
            "${TEMP_DIR}/nezha_arm64/nezha-agent" \
            -output Resources/nezha-agent
          
          echo "Determining latest ServerStatus-Rust version..."
          STATUS_VER=$(curl -sI https://github.com/zdz/ServerStatus-Rust/releases/latest | grep -i location | awk -F'/' '{print $NF}' | tr -d '\r\n')
          echo "Latest ServerStatus Version: ${STATUS_VER}"
          
          curl -L -o "${TEMP_DIR}/status_amd64.zip" "https://github.com/zdz/ServerStatus-Rust/releases/download/${STATUS_VER}/client-x86_64-apple-darwin.zip"
          curl -L -o "${TEMP_DIR}/status_arm64.zip" "https://github.com/zdz/ServerStatus-Rust/releases/download/${STATUS_VER}/client-aarch64-apple-darwin.zip"
          
          unzip -o "${TEMP_DIR}/status_amd64.zip" -d "${TEMP_DIR}/status_amd64"
          unzip -o "${TEMP_DIR}/status_arm64.zip" -d "${TEMP_DIR}/status_arm64"
          
          lipo -create \
            "${TEMP_DIR}/status_amd64/stat_client" \
            "${TEMP_DIR}/status_arm64/stat_client" \
            -output Resources/serverstatus-client
          
          echo "Determining latest FRP version..."
          FRP_VER=$(curl -sI https://github.com/fatedier/frp/releases/latest | grep -i location | awk -F'/' '{print $NF}' | tr -d '\r\n')
          echo "Latest FRP Version: ${FRP_VER}"
          FRP_RAW_VER="${FRP_VER#v}"
          
          curl -L -o "${TEMP_DIR}/frp_amd64.tar.gz" "https://github.com/fatedier/frp/releases/download/${FRP_VER}/frp_${FRP_RAW_VER}_darwin_amd64.tar.gz"
          curl -L -o "${TEMP_DIR}/frp_arm64.tar.gz" "https://github.com/fatedier/frp/releases/download/${FRP_VER}/frp_${FRP_RAW_VER}_darwin_arm64.tar.gz"
          
          tar -xzf "${TEMP_DIR}/frp_amd64.tar.gz" -C "${TEMP_DIR}"
          tar -xzf "${TEMP_DIR}/frp_arm64.tar.gz" -C "${TEMP_DIR}"
          
          lipo -create \
            "${TEMP_DIR}/frp_${FRP_RAW_VER}_darwin_amd64/frpc" \
            "${TEMP_DIR}/frp_${FRP_RAW_VER}_darwin_arm64/frpc" \
            -output Resources/frpc

          echo "Determining latest cloudflared version..."
          CFD_VER=$(curl -sI https://github.com/cloudflare/cloudflared/releases/latest | grep -i location | awk -F'/' '{print $NF}' | tr -d '\r\n')
          echo "Latest cloudflared Version: ${CFD_VER}"

          curl -L -o "${TEMP_DIR}/cloudflared_amd64.tgz" "https://github.com/cloudflare/cloudflared/releases/download/${CFD_VER}/cloudflared-darwin-amd64.tgz"
          curl -L -o "${TEMP_DIR}/cloudflared_arm64.tgz" "https://github.com/cloudflare/cloudflared/releases/download/${CFD_VER}/cloudflared-darwin-arm64.tgz"

          # The two archives contain identically named inner files; they must be extracted into separate directories before merging
          mkdir -p "${TEMP_DIR}/cfd_amd64" "${TEMP_DIR}/cfd_arm64"
          tar -xzf "${TEMP_DIR}/cloudflared_amd64.tgz" -C "${TEMP_DIR}/cfd_amd64"
          tar -xzf "${TEMP_DIR}/cloudflared_arm64.tgz" -C "${TEMP_DIR}/cfd_arm64"

          lipo -create \
            "${TEMP_DIR}/cfd_amd64/cloudflared" \
            "${TEMP_DIR}/cfd_arm64/cloudflared" \
            -output Resources/cloudflared

          echo "Building Universal tailcat binary..."
          chmod +x ./Scripts/build-tailcat.sh
          ./Scripts/build-tailcat.sh --native-only

          # devtunnel is a Microsoft proprietary EULA component and cannot be bundled or redistributed; it is not downloaded here;
          # Users can install it from Microsoft in the app via a one-click flow

          rm -rf "${TEMP_DIR}"
          echo "Successfully prepared latest universal binaries!"

      - name: Build Application 🔧
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          VERSION=${TAG_NAME#v}
          CURRENT_BUILD=$(python3 -c "import json; print(json.load(open('website/public/appcast.json')).get('build', 1))")
          NEXT_BUILD=$((CURRENT_BUILD + 1))
          echo "Compiling v${VERSION} with Build #${NEXT_BUILD}..."
          
          chmod +x ./build.sh
          ./build.sh "${VERSION}" "${NEXT_BUILD}"

      - name: Package DMG 📦
        id: package
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          DMG_NAME="MacHead-${TAG_NAME}-macos-universal.dmg"
          echo "Packaging DMG: ${DMG_NAME}..."
          
          # Create a temporary staging folder containing the App bundle and a symlink into the system Applications directory
          mkdir -p dist-dmg
          cp -R "MacHead.app" dist-dmg/
          ln -s /Applications dist-dmg/Applications
          
          # Package the staging directory into a DMG disk image; Finder will show the App + Applications shortcut folder for drag-and-drop installation
          hdiutil create -fs HFS+ -srcfolder dist-dmg -volname "MacHead" "${DMG_NAME}"
          
          echo "dmg_name=${DMG_NAME}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Upload DMG to Cloudflare R2 🚀
        run: |
          npm install -g wrangler
          wrangler r2 object put "headlessmac-releases/${{ steps.package.outputs.dmg_name }}" --file="${{ steps.package.outputs.dmg_name }}" --content-type="application/x-apple-diskimage" --remote
          wrangler r2 object put "headlessmac-releases/latest.dmg" --file="${{ steps.package.outputs.dmg_name }}" --content-type="application/x-apple-diskimage" --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Update appcast.json (User Release Notes) 📝
        id: appcast
        run: |
          TAG_NAME="${{ steps.package.outputs.tag_name }}"
          
          # Fetch all remote tags to ensure git describe can resolve the previous version correctly
          git fetch origin --tags --force || true
          
          # Check tag type (tag = annotated tag, commit = lightweight tag)
          TAG_TYPE=$(git cat-file -t "$TAG_NAME" 2>/dev/null || echo "commit")
          
          if [ "$TAG_TYPE" = "tag" ]; then
            # 1. Annotated tag: extract the tag description as the release note body
            USER_NOTES=$(git tag -l --format='%(contents)' "$TAG_NAME" | xargs)
          else
            # 2. Lightweight tag: clear the note body to trigger commit-log auto-generation below
            USER_NOTES=""
          fi
          
          # 3. If the description is empty (or the tag is lightweight), automatically collect all commit messages between the previous tag and the current tag
          if [ -z "$USER_NOTES" ]; then
            echo "No annotated tag message found. Auto-generating release notes from Git logs..."
            # Find the name of the previous tag
            PREV_TAG=$(git describe --tags --abbrev=0 "${TAG_NAME}^" 2>/dev/null || echo "")
            if [ -n "$PREV_TAG" ]; then
              COMMIT_RANGE="${PREV_TAG}..${TAG_NAME}"
            else
              COMMIT_RANGE="${TAG_NAME}"
            fi
            
            # Retrieve commit messages in range, excluding chore commits, merge commits, and CI skip commits
            USER_NOTES=$(git log "${COMMIT_RANGE}" --pretty=format:"1. %s" | \
              grep -viE "chore\(release\)|Merge pull request|Merge branch|\[skip ci\]" | \
              awk '{print NR ". " substr($0, 4)}' | \
              paste -sd "\n" - || echo "1. Improved system efficiency and fixed several known issues.")
          fi
          
          echo "Final release notes to be written:"
          echo "${USER_NOTES}"
          
          PUB_DATE=$(date +%Y-%m-%d)
          
          # Pass the extracted information to the Python script for safe JSON and homepage version sync rewriting
          export TAG_NAME USER_NOTES PUB_DATE
          python3 -c "
          import json
          import os
          import re

          tag = os.environ['TAG_NAME']
          version = tag.lstrip('v')
          notes = os.environ['USER_NOTES']
          pub_date = os.environ['PUB_DATE']

          appcast_path = 'website/public/appcast.json'
          with open(appcast_path, 'r') as f:
              data = json.load(f)

          current_build = int(data.get('build', 1))

          data['version'] = version
          data['build'] = current_build + 1
          data['pubDate'] = pub_date
          data['url'] = f'https://releases.headlessmac.com/MacHead-{tag}-macos-universal.dmg'
          data['releaseNotes'] = notes

          with open(appcast_path, 'w') as f:
              json.dump(data, f, indent=2, ensure_ascii=False)

          for index_path in ['website/index.html', 'website/en/index.html']:
              with open(index_path, 'r') as f:
                  html = f.read()
              html = re.sub(
                  r'(<span class=\"badge-text\">)v[0-9.]+( Universal[^<]*</span>)',
                  rf'\g<1>v{version}\g<2>',
                  html
              )
              html = re.sub(
                  r'(id=\"download-cta-link\">(?:Download|Download) macOS Universal DMG)[^<]*(</a>)',
                  rf'\g<1> v{version}\g<2>',
                  html
              )
              html = re.sub(
                  r'(\"softwareVersion\":\s*\")[0-9.]+(\")',
                  rf'\g<1>{version}\g<2>',
                  html
              )
              with open(index_path, 'w') as f:
                  f.write(html)
          "
          echo "Successfully updated appcast.json, website/index.html, and website/en/index.html"

      - name: Commit and Push appcast.json 💾
        run: |
          TAG_NAME="${{ steps.package.outputs.tag_name }}"
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add website/public/appcast.json website/index.html website/en/index.html
          git commit -m "chore(release): update appcast.json for ${TAG_NAME}"
          git push origin HEAD:main

      - name: Deploy Updated Website & appcast.json to Cloudflare Pages 🌐
        run: |
          cd website
          npm ci
          npm run build
          wrangler pages deploy dist --project-name headlessmac --branch main --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Create GitHub Release (Technical Release Notes) 🎁
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.package.outputs.dmg_name }}
          generate_release_notes: true # Automatically generate technical release notes from commit history
          body: |
            ## MacHead ${{ steps.package.outputs.tag_name }}
            
            Technical change details are listed in the automatically generated commit log below.
            User-facing release notes are served via OTA update channel.
