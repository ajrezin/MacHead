name: 🐛 Bug report
description: A feature is not behaving as expected
labels: ["bug"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Briefly describe the observed behavior and expected behavior (expected vs actual)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: MacHead version
      description: Menu bar icon → About (for example, 0.1.23 build 26)
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: macOS version & model
      description: For example, macOS 15.6, MacBook Pro 14" M3 Pro
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Enable …
        2. Close the lid …
        3. Observe …
  - type: textarea
    id: logs
    attributes:
      label: Logs (optional)
      description: Error output from running `/Applications/MacHead.app/Contents/MacOS/MacHead` in Terminal
      render: shell
  - type: markdown
    attributes:
      value: |
        ⚠️ For security vulnerabilities, do not use this template; use [private vulnerability reporting](https://github.com/ox01024/MacHead/security/advisories/new).
