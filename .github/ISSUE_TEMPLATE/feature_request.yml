name: 💡 Feature request
description: New feature or improvement idea
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: Use case / Your use case
      description: In what situation would you like this problem solved? (This matters more than the implementation details)
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What interaction or implementation approach would you expect? (optional)
